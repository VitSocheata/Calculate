<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1b3a33, #143335);
      font-family: 'Poppins', sans-serif;
    }

    .calculator {
      width: 280px;
      background: rgba(255, 255, 255, 0.08);
      padding: 15px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .4);
      backdrop-filter: blur(8px);
    }

    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 10px;
      color: #fff;
    }

    .display {
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 24px;
      padding: 15px;
      border-radius: 10px;
      text-align: right;
      margin-bottom: 15px;
      min-height: 40px;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      padding: 15px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .span-2 {
      grid-column: span 2;
    }

    .span-3 {
      grid-row: span 2;
    }
  </style>
</head>

<body>
  <div class="calculator">
    <h1>Calculator</h1>
    <div class="display" id="result"></div>
    <div class="keys">
      <button onclick="clearDisplay()"> AC </button>
      <button onclick="mol()"> % </button>
      <button onclick="div()"> ÷ </button>
      <button onclick="mul()"> x </button>

      <button onclick="numSeven()"> 7 </button>
      <button onclick="numEight()"> 8 </button>
      <button onclick="numNine()"> 9 </button>
      <button onclick="sub()"> - </button>

      <button onclick="numFour()"> 4 </button>
      <button onclick="numFive()"> 5 </button>
      <button onclick="numSix()"> 6 </button>
      <button onclick="sum()"> + </button>

      <button onclick="numOne()"> 1 </button>
      <button onclick="numTwo()"> 2 </button>
      <button onclick="numThree()"> 3 </button>
      <button class="span-3" onclick="cal()"> = </button>

      <button class="span-2" onclick="numZero"> 0 </button>
      <button onclick="dot()">.</button>
    </div>
  </div>


  <script>
    function dot(){
      document.getElementById('result').innerText += ".";
    }
    function numZero(){
      document.getElementById('result').innerText += 0;
    }
    function numOne(){
      document.getElementById('result').innerText += 1;
    }
    function numTwo(){
      document.getElementById('result').innerText += 2;
    }
    function numThree(){
      document.getElementById('result').innerText += 3;
    }
    function numFour(){
      document.getElementById('result').innerText += 4;
    }
    function numFive(){
      document.getElementById('result').innerText += 5;
    }
    function numSix(){
      document.getElementById('result').innerText += 6;
    }
    function numSeven(){
      document.getElementById('result').innerText += 7;
    }
    function numEight(){
      document.getElementById('result').innerText += 8;
    }
    function numNine(){
      document.getElementById('result').innerText += 9;
    }
    function sum(){
      document.getElementById('result').innerText += "+";
    }
    function sub(){
      document.getElementById('result').innerText += "-";
    }
    function mul(){
      document.getElementById('result').innerText += "*";
    }
    function div(){
      document.getElementById('result').innerText += "/";
    }
    function mol(){
      document.getElementById('result').innerText += "%";
    }

    function cal(){
      let body = document.getElementById('result').innerText;
      console.log(body);
      document.getElementById('result').innerText = eval(body);
    }
    function clearDisplay(){
        document.getElementById('result').innerText = "";
    }
  </script>
</body>
</html>
